name: "Project board automation"

# Scrum board tự động hoá (mirror các built-in workflows của GitHub Projects,
# nhưng version-controlled và chạy với GITHUB_TOKEN):
#   - issue opened/reopened      → vào board ở cột "Product Backlog"
#   - PR opened/reopened/ready   → issue liên kết chuyển "In Review/QA"
#   - PR merged                  → issue liên kết chuyển "Done"
# IDs của project + field là node id ổn định — đổi struct board thì phải sửa tại đây.
# Lưu ý: GraphQL luôn gửi qua jq-variables (không nối chuỗi có dấu `\"` —
# gh -f ăn lỗi escape, đã xác minh: query mở rộng hợp lệ nhưng gh parse sai).

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  issues: read
  pull-requests: read
  repository-projects: write

env:
  PROJECT_ID: "PVT_kwDOFGUMk84Bot8b"
  STATUS_FIELD_ID: "PVTSSF_lADOFGUMk84Bot8bzhnMtbE"
  OPT_PRODUCT_BACKLOG: "f431a712"
  OPT_REVIEW: "92ca92aa"
  OPT_DONE: "21e5d249"

jobs:
  issue-to-backlog:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Thêm issue vào board ở cột Product Backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gq() { # $1 = query; còn lại: KEY=VALUE (biến GraphQL)
            Q="$1"; shift; V="{}"
            for kv in "$@"; do
              V=$(printf '%s' "$V" | jq --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k):$v}')
            done
            printf '{"query":%s,"variables":%s}' "$(jq -Rn --arg q "$Q" '$q')" "$V" > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          ADDQ='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}'
          LOOKQ='query($c:ID!){node(id:$c){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}'
          SETQ='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}'
          ITEM=$(gq "$ADDQ" "p=$PROJECT_ID" "c=$ISSUE_NODE" | jq -r '.data.addProjectV2ItemById.item.id // empty')
          if [ -z "$ITEM" ]; then
            ITEM=$(gq "$LOOKQ" "c=$ISSUE_NODE" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
          fi
          if [ -z "$ITEM" ]; then echo "::error::không tạo được board item cho issue #$NUMBER"; exit 1; fi
          gq "$SETQ" "p=$PROJECT_ID" "i=$ITEM" "f=$STATUS_FIELD_ID" "o=$OPT_PRODUCT_BACKLOG" > /dev/null
          echo "issue #$NUMBER → Product Backlog (item $ITEM)"

  pr-in-review:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - name: Chuyển issue liên kết PR sang In Review/QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
        run: |
          gq() {
            Q="$1"; shift; V="{}"
            for kv in "$@"; do
              V=$(printf '%s' "$V" | jq --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k):$v}')
            done
            printf '{"query":%s,"variables":%s}' "$(jq -Rn --arg q "$Q" '$q')" "$V" > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          ISSUESQ='query($c:ID!){node(id:$c){... on PullRequest{closingIssuesReferences(first:10){nodes{id}}}}}'
          LOOKQ='query($c:ID!){node(id:$c){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}'
          SETQ='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}'
          ISSUES=$(gq "$ISSUESQ" "c=$PR_NODE" | jq -r '.data.node.closingIssuesReferences.nodes[].id // empty')
          for I in $ISSUES; do
            ITEM=$(gq "$LOOKQ" "CONTENT_ID=$I" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
            if [ -n "$ITEM" ]; then
              gq "$SETQ" "p=$PROJECT_ID" "i=$ITEM" "f=$STATUS_FIELD_ID" "o=$OPT_REVIEW" > /dev/null
              echo "→ In Review/QA: $I"
            else
              echo "::warning::issue $I chưa có trên board — bỏ qua"
            fi
          done

  pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Chuyển issue liên kết PR sang Done khi merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
        run: |
          gq() {
            Q="$1"; shift; V="{}"
            for kv in "$@"; do
              V=$(printf '%s' "$V" | jq --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k):$v}')
            done
            printf '{"query":%s,"variables":%s}' "$(jq -Rn --arg q "$Q" '$q')" "$V" > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          ISSUESQ='query($c:ID!){node(id:$c){... on PullRequest{closingIssuesReferences(first:10){nodes{id}}}}}'
          LOOKQ='query($c:ID!){node(id:$c){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}'
          SETQ='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}'
          ISSUES=$(gq "$ISSUESQ" "c=$PR_NODE" | jq -r '.data.node.closingIssuesReferences.nodes[].id // empty')
          for I in $ISSUES; do
            ITEM=$(gq "$LOOKQ" "CONTENT_ID=$I" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
            if [ -n "$ITEM" ]; then
              gq "$SETQ" "p=$PROJECT_ID" "i=$ITEM" "f=$STATUS_FIELD_ID" "o=$OPT_DONE" > /dev/null
              echo "→ Done: $I"
            else
              echo "::warning::issue $I chưa có trên board — bỏ qua"
            fi
          done
