name: "Project board automation"

# Scrum board tự động hoá cho project ORG "GearLoop Scrum Board":
#   - issue opened/reopened      → vào board ở cột "Product Backlog"
#   - PR opened/reopened/ready   → issue liên kết chuyển "In Review/QA"
#   - PR merged                  → issue liên kết chuyển "Done"
# GITHUB_TOKEN chỉ tự động hoá được project THUỘC ORG (board user riêng không chạy được
# với GITHUB_TOKEN). Query GraphQL dựng bằng printf + jq (KHÔNG nối chuỗi có dấu `\"`
# — gh -f ăn lỗi escape; KHÔNG dùng biến kiểu ID! — GitHub từ chối string).
# IDs project/field là node id ổn định — đổi struct board thì phải sửa tại đây.

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  issues: read
  pull-requests: read
  repository-projects: write

env:
  PROJECT_ID: "PVT_kwDOFGUMk84BouW7"
  STATUS_FIELD_ID: "PVTSSF_lADOFGUMk84BouW7zhnNGCQ"
  OPT_PRODUCT_BACKLOG: "cfdc16bc"
  OPT_REVIEW: "2e627958"
  OPT_DONE: "82a79b21"

jobs:
  issue-to-backlog:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Thêm issue vào board ở cột Product Backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gq() { # $1 = query printf (%s = id); còn lại: các giá trị id
            Q=$(printf "$1" "${@:2}")
            jq -n --arg q "$Q" '{query:$q}' > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          RESP=$(gq 'mutation{addProjectV2ItemById(input:{projectId:"%s",contentId:"%s"}){item{id}}}' "$PROJECT_ID" "$ISSUE_NODE")
          ITEM=$(echo "$RESP" | jq -r '.data.addProjectV2ItemById.item.id // empty')
          if [ -z "$ITEM" ]; then
            echo "RAW_ADD_RESP: $(echo "$RESP" | head -c 800)"
            ITEM=$(gq 'query{node(id:"%s"){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}' "$ISSUE_NODE" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
          fi
          if [ -z "$ITEM" ]; then echo "::error::không tạo được board item cho issue #$NUMBER"; exit 1; fi
          gq 'mutation{updateProjectV2ItemFieldValue(input:{projectId:"%s",itemId:"%s",fieldId:"%s",value:{singleSelectOptionId:"%s"}}){projectV2Item{id}}}' "$PROJECT_ID" "$ITEM" "$STATUS_FIELD_ID" "$OPT_PRODUCT_BACKLOG" > /dev/null
          echo "issue #$NUMBER → Product Backlog (item $ITEM)"

  pr-in-review:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - name: Chuyển issue liên kết PR sang In Review/QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
        run: |
          gq() {
            Q=$(printf "$1" "${@:2}")
            jq -n --arg q "$Q" '{query:$q}' > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          ISSUES=$(gq 'query{node(id:"%s"){... on PullRequest{closingIssuesReferences(first:10){nodes{id}}}}}' "$PR_NODE" | jq -r '.data.node.closingIssuesReferences.nodes[].id // empty')
          for I in $ISSUES; do
            ITEM=$(gq 'query{node(id:"%s"){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}' "$I" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
            if [ -n "$ITEM" ]; then
              gq 'mutation{updateProjectV2ItemFieldValue(input:{projectId:"%s",itemId:"%s",fieldId:"%s",value:{singleSelectOptionId:"%s"}}){projectV2Item{id}}}' "$PROJECT_ID" "$ITEM" "$STATUS_FIELD_ID" "$OPT_REVIEW" > /dev/null
              echo "→ In Review/QA: $I"
            else
              echo "::warning::issue $I chưa có trên board — bỏ qua"
            fi
          done

  pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Chuyển issue liên kết PR sang Done khi merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
        run: |
          gq() {
            Q=$(printf "$1" "${@:2}")
            jq -n --arg q "$Q" '{query:$q}' > /tmp/q.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/graphql -X POST --data-binary @/tmp/q.json
          }
          ISSUES=$(gq 'query{node(id:"%s"){... on PullRequest{closingIssuesReferences(first:10){nodes{id}}}}}' "$PR_NODE" | jq -r '.data.node.closingIssuesReferences.nodes[].id // empty')
          for I in $ISSUES; do
            ITEM=$(gq 'query{node(id:"%s"){... on Issue{projectItems(first:20){nodes{id project{id}}}}}}' "$I" | jq -r --arg p "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id==$p) | .id' | head -1)
            if [ -n "$ITEM" ]; then
              gq 'mutation{updateProjectV2ItemFieldValue(input:{projectId:"%s",itemId:"%s",fieldId:"%s",value:{singleSelectOptionId:"%s"}}){projectV2Item{id}}}' "$PROJECT_ID" "$ITEM" "$STATUS_FIELD_ID" "$OPT_DONE" > /dev/null
              echo "→ Done: $I"
            else
              echo "::warning::issue $I chưa có trên board — bỏ qua"
            fi
          done
